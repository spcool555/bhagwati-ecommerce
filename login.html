<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhagwati Admin Login</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fc;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-panel {
            width: min(100%, 420px);
            background: white;
            border-radius: 12px;
            box-shadow: 0 18px 45px rgba(17, 24, 39, 0.14);
            padding: 34px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: inline-grid;
            place-items: center;
            font-size: 24px;
            margin-bottom: 14px;
        }

        .brand h1 {
            color: #111827;
            font-size: 26px;
            margin-bottom: 6px;
        }

        .brand p {
            color: #6b7280;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 13px 14px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            padding: 11px 12px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            padding: 13px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        @media (max-width: 480px) {
            .login-panel {
                padding: 26px 22px;
            }
        }
    </style>
</head>

<body>
    <main class="login-panel">
        <div class="brand">
            <div class="brand-icon">
                <i class="fa fa-lock"></i>
            </div>
            <h1>Admin Login</h1>
            <p>Sign in to continue to Bhagwati Admin Panel</p>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="login-error" id="loginError">
                Invalid username or password.
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required />
            </div>

            <button type="submit" class="login-btn">
                <i class="fa fa-sign-in-alt"></i>
                Login
            </button>
        </form>
    </main>

    <script>
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = '12345';
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');

        if (sessionStorage.getItem('bhagwatiAdminAuthenticated') === 'true') {
            window.location.replace('admin.html');
        }

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                sessionStorage.setItem('bhagwatiAdminAuthenticated', 'true');
                window.location.href = 'admin.html';
                return;
            }

            loginError.style.display = 'block';
        });
    </script>
</body>

</html>
