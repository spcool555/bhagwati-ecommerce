<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Secure admin login for Bhagwati Cards and Paper Products management portal.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="login.html">
    <title>Bhagwati Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { min-height: 100vh; background: #f4f7fc; display: grid; place-items: center; padding: 24px; }
        .login-panel { width: min(100%, 420px); background: white; border-radius: 12px; box-shadow: 0 18px 45px rgba(17, 24, 39, 0.14); padding: 34px; }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand-icon { width: 58px; height: 58px; border-radius: 50%; background: #2563eb; color: white; display: inline-grid; place-items: center; font-size: 24px; margin-bottom: 14px; }
        .brand h1 { color: #111827; font-size: 26px; margin-bottom: 6px; }
        .brand p { color: #6b7280; font-size: 15px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: #374151; font-weight: bold; margin-bottom: 8px; }
        .form-group input { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 13px 14px; font-size: 15px; outline: none; }
        .form-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        .login-error { display: none; background: #fee2e2; color: #991b1b; border-radius: 8px; padding: 11px 12px; font-size: 14px; margin-bottom: 16px; }
        .login-btn { width: 100%; border: none; background: #2563eb; color: white; border-radius: 8px; padding: 13px 18px; font-size: 16px; cursor: pointer; }
        .login-btn:hover { background: #1d4ed8; }
        .whatsapp-float { position: fixed; right: 22px; bottom: 22px; width: 58px; height: 58px; border-radius: 50%; background: #25D366; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; line-height: 1; text-decoration: none; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24); z-index: 9999; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .whatsapp-float:hover { color: #fff; transform: translateY(-3px); box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28); }
        @media (max-width: 480px) { .login-panel { padding: 26px 22px; } }
    </style>
</head>
<body>
    <main class="login-panel">
        <div class="brand">
            <div class="brand-icon"><i class="fa fa-lock"></i></div>
            <h1>Admin Login</h1>
            <p>Sign in to continue to Bhagwati Admin Panel</p>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="login-error" id="loginError">Invalid email or password.</div>

            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" name="email" placeholder="enter-admin@email.com" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required />
            </div>

            <button type="submit" class="login-btn">
                <i class="fa fa-sign-in-alt"></i> Login
            </button>
        </form>
    </main>

    <a class="whatsapp-float" href="https://wa.me/918208960864" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script type="module">
        // Imported the correct modules matching your config's version (12.14.0)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-analytics.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        // Your specific project configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCKvdzwTDuAhwx5GVD2k4s_gunEyS_Tlfk",
            authDomain: "gwati-7fb19.firebaseapp.com",
            projectId: "gwati-7fb19",
            storageBucket: "gwati-7fb19.firebasestorage.app",
            messagingSenderId: "478302101679",
            appId: "1:478302101679:web:4cc1b8df230ea833d3345a",
            measurementId: "G-6VC4T69W72"
        };

        // Initialize Firebase services
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');

        // Check if an admin is already signed in; if so, pass them through
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.replace('admin.html');
            }
        });

        // Handle the login process
        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            loginError.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'admin.html';
            } catch (error) {
                console.error("Firebase Login Error:", error.message);
                loginError.textContent = "Authentication failed. Invalid email or password.";
                loginError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
